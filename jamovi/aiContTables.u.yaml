title: Contingency Tables + Report
name: aiContTables
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Rows
        children:
          - type: VariablesListBox
            name: rows
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Columns
        children:
          - type: VariablesListBox
            name: cols
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    style: inline
    children:
      - type: Label
        label: Tests
        children:
          - type: CheckBox
            name: chiSq
          - type: CheckBox
            name: chiSqCorr
          - type: CheckBox
            name: likeRat
          - type: CheckBox
            name: fisher
      - type: Label
        label: Effect sizes
        children:
          - type: CheckBox
            name: phiCra
          - type: CheckBox
            name: contCoef
      - type: Label
        label: Cells
        children:
          - type: CheckBox
            name: pcRow
          - type: CheckBox
            name: pcCol
          - type: CheckBox
            name: exp
  - type: CollapseBox
    label: Report
    collapsed: false
    margin: large
    children:
      - type: ComboBox
        name: lang
      - type: CheckBox
        name: useLLM
      - type: CheckBox
        name: interp
        enable: (useLLM)
      - type: CheckBox
        name: polish
        enable: (useLLM)
      - type: TextBox
        name: model
        format: string
        width: large
        enable: (useLLM)
      - type: TextBox
        name: endpoint
        format: string
        width: largest
        enable: (useLLM)

