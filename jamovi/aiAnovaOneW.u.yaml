title: One-Way ANOVA + Report
name: aiAnovaOneW
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variables
        children:
          - type: VariablesListBox
            name: deps
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    style: inline
    children:
      - type: Label
        label: Tests
        children:
          - type: CheckBox
            name: fishers
          - type: CheckBox
            name: welchs
          - type: CheckBox
            name: kruskal
      - type: Label
        label: Post hoc
        children:
          - type: ComboBox
            name: phMethod
      - type: Label
        label: Additional
        children:
          - type: CheckBox
            name: desc
          - type: CheckBox
            name: norm
          - type: CheckBox
            name: eqv
  - type: CollapseBox
    label: Report
    collapsed: false
    margin: large
    children:
      - type: ComboBox
        name: lang
      - type: CheckBox
        name: useLLM
      - type: TextBox
        name: model
        format: string
        width: large
        enable: (useLLM)
      - type: TextBox
        name: endpoint
        format: string
        width: largest
        enable: (useLLM)

