---
title: AI Report Writer
name: jmvReport
version: 0.2.0
jms: '1.0'
authors:
  - Fikret Bartu Yurdacan
maintainer: Fikret Bartu Yurdacan <fbartuyurdacan@trakya.edu.tr>
date: '2026-09-10'
type: R
description: >-
  Writes English APA-style Method and Results text from jamovi analyses.
  Statistical values come from deterministic templates. Optional AI can use
  Ollama, a managed built-in llama.cpp runtime, or a user-configured
  OpenAI-compatible server; rewritten values are checked before use.
analyses:
  - title: Report Writer (from saved file)
    name: reportOmv
    ns: jmvReport
    menuGroup: AI Report
    menuTitle: Report Writer (from saved file)
    menuSubgroup: null
    description: >
      Reads every analysis stored in a saved jamovi file (.omv), recomputes the
      results and writes English APA-style Method and Results text. Numbers
      always come from the computed results. An optional local or
      user-configured language model may interpret or reword the text; output is
      checked against the computed values.
    category: analyses
  - title: Independent Samples T-Test + Report
    name: aiTtestIS
    ns: jmvReport
    menuGroup: AI Report
    menuTitle: Independent Samples T-Test + Report
    menuSubgroup: Analyses with Report
    description: >-
      Independent samples t-test (Student, Welch, Mann-Whitney) with an
      APA-style report paragraph.
    category: analyses
  - title: One-Way ANOVA + Report
    name: aiAnovaOneW
    ns: jmvReport
    menuGroup: AI Report
    menuTitle: One-Way ANOVA + Report
    menuSubgroup: Analyses with Report
    description: >-
      One-way ANOVA (Fisher / Welch) and Kruskal-Wallis with post hoc tests and
      an APA-style report paragraph.
    category: analyses
  - title: Correlation Matrix + Report
    name: aiCorr
    ns: jmvReport
    menuGroup: AI Report
    menuTitle: Correlation Matrix + Report
    menuSubgroup: Analyses with Report
    description: >-
      Pearson / Spearman / Kendall correlations with an APA-style report
      paragraph.
    category: analyses
  - title: Contingency Tables + Report
    name: aiContTables
    ns: jmvReport
    menuGroup: AI Report
    menuTitle: Contingency Tables + Report
    menuSubgroup: Analyses with Report
    description: >-
      Chi-square test of independence (with Fisher's exact test and effect
      sizes) and an APA-style report paragraph.
    category: analyses
  - title: Local AI Setup
    name: localAISetup
    ns: jmvReport
    category: analyses
    menuGroup: AI Report
    menuTitle: Local AI Setup
    description: >
      Installs or repairs the optional built-in llama.cpp runtime and the
      verified 2.39 GB Qwen3.5 model. Nothing is downloaded until the user
      explicitly starts installation.
datasets: []
usesNative: false
minApp: 2.3.0

...
