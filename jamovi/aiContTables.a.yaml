---
name: aiContTables
title: Contingency Tables + Report
menuGroup: AI Report
menuSubgroup: Analyses with Report
version: '1.0.0'
jas: '1.2'

description:
    main: Chi-square test of independence (with Fisher's exact test and effect sizes) and an APA-style report paragraph.

options:
    - name: data
      type: Data

    - name: rows
      title: Rows
      type: Variable
      suggested: [nominal, ordinal]
      permitted: [factor]

    - name: cols
      title: Columns
      type: Variable
      suggested: [nominal, ordinal]
      permitted: [factor]

    - name: chiSq
      title: χ² test
      type: Bool
      default: true

    - name: chiSqCorr
      title: χ² continuity correction
      type: Bool
      default: false

    - name: likeRat
      title: Likelihood ratio
      type: Bool
      default: false

    - name: fisher
      title: Fisher's exact test
      type: Bool
      default: false

    - name: phiCra
      title: Phi and Cramér's V
      type: Bool
      default: true

    - name: contCoef
      title: Contingency coefficient
      type: Bool
      default: false

    - name: pcRow
      title: Row percentages
      type: Bool
      default: false

    - name: pcCol
      title: Column percentages
      type: Bool
      default: false

    - name: exp
      title: Expected counts
      type: Bool
      default: false

    - name: useLLM
      title: Use AI interpretation and optional wording polish
      type: Bool
      default: false


    - name: backend
      title: AI backend
      type: List
      options:
        - name: auto
          title: Auto (Ollama, then built-in)
        - name: ollama
          title: Ollama
        - name: builtin
          title: Built-in llama.cpp
        - name: openai
          title: OpenAI-compatible server
      default: auto
    - name: interp
      title: AI interpretation of the findings
      type: Bool
      default: true

    - name: polish
      title: Also rewrite the Results wording with AI (slower)
      type: Bool
      default: false

    - name: model
      title: Model (Ollama or custom server)
      type: String
      default: "qwen3.5:4b"

    - name: endpoint
      title: Custom server URL (optional)
      type: String
      default: ''
...
