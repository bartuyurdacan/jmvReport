---
name: aiCorr
title: Correlation Matrix + Report
menuGroup: AI Report
menuSubgroup: Analyses with Report
version: '1.0.0'
jas: '1.2'

description:
    main: Pearson / Spearman / Kendall correlations with an APA-style report paragraph.

options:
    - name: data
      type: Data

    - name: vars
      title: Variables
      type: Variables
      suggested: [continuous, ordinal]
      permitted: [numeric]

    - name: pearson
      title: Pearson
      type: Bool
      default: true

    - name: spearman
      title: Spearman
      type: Bool
      default: false

    - name: kendall
      title: Kendall's tau-b
      type: Bool
      default: false

    - name: ci
      title: Confidence intervals (Pearson)
      type: Bool
      default: false

    - name: useLLM
      title: Use AI interpretation and optional wording polish
      type: Bool
      default: false


    - name: backend
      title: AI backend
      type: List
      options:
        - name: auto
          title: Auto (Ollama, then built-in)
        - name: ollama
          title: Ollama
        - name: builtin
          title: Built-in llama.cpp
        - name: openai
          title: OpenAI-compatible server
      default: auto
    - name: interp
      title: AI interpretation of the findings
      type: Bool
      default: true

    - name: polish
      title: Also rewrite the Results wording with AI (slower)
      type: Bool
      default: false

    - name: model
      title: Model (Ollama or custom server)
      type: String
      default: "qwen3.5:4b"

    - name: endpoint
      title: Custom server URL (optional)
      type: String
      default: ''
...
