---
name: aiCorr
title: Correlation Matrix + Report
menuGroup: AI Report
menuSubgroup: Analyses with Report
version: '1.0.0'
jas: '1.2'

description:
    main: Pearson / Spearman / Kendall correlations with an APA-style report paragraph.

options:
    - name: data
      type: Data

    - name: vars
      title: Variables
      type: Variables
      suggested: [continuous, ordinal]
      permitted: [numeric]

    - name: pearson
      title: Pearson
      type: Bool
      default: true

    - name: spearman
      title: Spearman
      type: Bool
      default: false

    - name: kendall
      title: Kendall's tau-b
      type: Bool
      default: false

    - name: ci
      title: Confidence intervals (Pearson)
      type: Bool
      default: false

    - name: lang
      title: Report language
      type: List
      options:
        - name: tr
          title: Türkçe
        - name: en
          title: English
      default: tr

    - name: useLLM
      title: AI wording and interpretation (Ollama, local)
      type: Bool
      default: true

    - name: interp
      title: AI interpretation of the findings
      type: Bool
      default: true

    - name: polish
      title: Also rewrite the Results wording with AI (slower)
      type: Bool
      default: false

    - name: model
      title: Ollama model
      type: String
      default: "qwen3.5:4b"

    - name: endpoint
      title: Ollama server
      type: String
      default: "http://localhost:11434"
...
