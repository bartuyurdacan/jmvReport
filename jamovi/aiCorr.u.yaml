title: Correlation Matrix + Report
name: aiCorr
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: LayoutBox
    margin: large
    style: inline
    children:
      - type: Label
        label: Correlation coefficients
        children:
          - type: CheckBox
            name: pearson
          - type: CheckBox
            name: spearman
          - type: CheckBox
            name: kendall
      - type: Label
        label: Additional
        children:
          - type: CheckBox
            name: ci
  - type: CollapseBox
    label: Report
    collapsed: false
    margin: large
    children:
      - type: CheckBox
        name: useLLM
      - type: ComboBox
        name: backend
        enable: (useLLM)
      - type: CheckBox
        name: interp
        enable: (useLLM)
      - type: CheckBox
        name: polish
        enable: (useLLM)
      - type: TextBox
        name: model
        format: string
        width: large
        enable: (useLLM)
      - type: TextBox
        name: endpoint
        format: string
        width: largest
        enable: (useLLM)

